# Weekly drift monitoring — split into Saturday submit + Sunday retrieve
name: "Weekly: submit batches"

on:
  schedule:
    - cron: "0 19 * * 0"  # Sunday 20:00 Berlin (19:00 UTC)
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Sample subset and submit batches
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          RUN_ID: gha-${{ github.run_id }}
        run: |
          python scripts/run_eval.py --subset-size 300 --batch-ids data/batch_ids.json --run-id "$RUN_ID"
      - name: Cache batch IDs for retrieve workflow
        uses: actions/cache/save@v4
        with:
          path: data/batch_ids.json
          key: weekly-batch-ids-${{ github.run_id }}
      - name: Upload batch IDs
        uses: actions/upload-artifact@v4
        with:
          name: batch_ids
          path: data/batch_ids.json
