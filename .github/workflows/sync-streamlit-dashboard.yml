name: Sync Streamlit dashboard repo

on:
  schedule:
    - cron: "0 7 * * 0"   # Sunday 07:00 UTC — 2h after weekly_retrieve (05:00 UTC)
  push:
    branches:
      - main
    paths:
      - "streamlit_app/**"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: GeorgiiBurdinComo/llm-eval-dashboard
          token: ${{ secrets.STREAMLIT_SYNC_TOKEN }}
          path: target-repo

      - name: Sync files
        run: |
          rsync -av --delete \
            --exclude ".git" \
            streamlit_app/ target-repo/

      - name: Commit and push if changed
        run: |
          cd target-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: sync Streamlit app from gocomo/llm-batch-eval"
          git push origin main